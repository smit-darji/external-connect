name: Build Image and Trigger Deploy

on:
  push:
    branches: [ "Master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set SHORT_SHA
        id: vars
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: smitdarji
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t smitdarji/external-connect:${{ steps.vars.outputs.SHA_SHORT }} .
          docker push smitdarji/external-connect:${{ steps.vars.outputs.SHA_SHORT }}

      - name: Trigger manifest repo workflow
        env:
          GH_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
        run: |
          SERVICE="external-connect"
          TAG=${{ steps.vars.outputs.SHA_SHORT }}
          ./trigger-manifest-update.sh "$SERVICE" "$TAG"
          